name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kelma_sync_test
          POSTGRES_USER: kelma
          POSTGRES_PASSWORD: kelma
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U kelma -d kelma_sync_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify modules
        run: go mod verify
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://kelma:kelma@localhost:5433/kelma_sync_test?sslmode=disable
        # Database-backed packages share this one disposable PostgreSQL service.
        run: go test -p 1 -count=1 ./...
      - name: Race tests
        env:
          TEST_DATABASE_URL: postgres://kelma:kelma@localhost:5433/kelma_sync_test?sslmode=disable
        run: go test -p 1 -race -count=1 ./internal/fsrs ./internal/projection ./internal/handler
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/server
      - name: In-process FSRS worker smoke test
        env:
          DATABASE_URL: postgres://kelma:kelma@localhost:5433/kelma_sync_test?sslmode=disable
        run: ./scripts/run_fsrs_smoke_local.sh
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Compile-check Python clients
        run: python3 -m compileall -q clients/python scripts
      - name: Test checksum helper
        run: cargo test --locked --manifest-path clients/rust/kelma-hash/Cargo.toml

  scale:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kelma_sync_scale
          POSTGRES_USER: kelma
          POSTGRES_PASSWORD: kelma
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U kelma -d kelma_sync_scale"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://kelma:kelma@localhost:5433/kelma_sync_scale?sslmode=disable
      FSRS_SCALE_TEST: "1"
      FSRS_SCALE_CARDS: "1000"
      FSRS_SCALE_REVIEWS_PER_CARD: "100"
      FSRS_SCALE_MIGRATION_LIMIT_SECONDS: "60"
      FSRS_SCALE_DRAIN_LIMIT_SECONDS: "180"
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Projection backfill and queue drain at scale
        run: go test ./internal/projection -run '^TestProjectionBackfillScale$' -v -count=1 -timeout=5m

  fsrs-oracle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Reproduce the pinned py-fsrs fixture
        run: |
          ./tools/fsrs_oracle/generate.sh
          git diff --exit-code -- internal/fsrs/testdata/py-fsrs-6.3.1-vectors.json
